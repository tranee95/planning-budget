# cargo-deny: лицензии, уязвимости и запрет сетевых клиентов.

[graph]
# Только десктопные цели. Мобильные (Android/iOS) тянут reqwest и hyper, но мы их не собираем.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Заброшенные транзитивные зависимости Tauri (unic-*, paste, proc-macro-error) мы не контролируем:
# проверяем такие предупреждения только у прямых зависимостей workspace.
unmaintained = "workspace"
# zip 4.6.1 приходит только через tauri-plugin-updater 2.12.0 (последняя стабильная версия требует zip 4,
# исправление есть в zip 9). Плагин вызывает ZipArchive::extract на Windows для архива обновления,
# скачанного по HTTPS и проверенного подписью релиза, так что злоумышленный архив до распаковки
# не доходит. Снять исключения, когда выйдет стабильный плагин на zip 9+.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip 4.6.1 из tauri-plugin-updater; архив обновления проверен подписью" },
    { id = "RUSTSEC-2026-0368", reason = "zip 4.6.1 из tauri-plugin-updater; архив обновления проверен подписью" },
    { id = "RUSTSEC-2026-0369", reason = "zip 4.6.1 из tauri-plugin-updater; архив обновления проверен подписью" },
    { id = "RUSTSEC-2026-0429", reason = "zip 4.6.1 из tauri-plugin-updater; архив обновления проверен подписью" },
    # SQLite до 3.54.0 может вернуть неинициализированную память кэша страниц, если рядом с базой лежит
    # `-wal` с другим размером страницы. Исправление — sqlcipher-src 420 в libsqlite3-sys 0.40 (rusqlite 0.42),
    # а rusqlite_migration (последняя 2.7) работает только с rusqlite 0.41, где sqlcipher-src 419 тоже
    # уязвим и добавляет лицензии blessing и WTFPL. Файлы `budget.db` и `-wal` пишет только приложение, база
    # зашифрована и проверяется HMAC. Это верно для рабочих хранилищ, но не для файла копии `.budgetbak`
    # от постороннего: его автор знает ключ и может собрать базу под разбор SQLite. Копия не содержит
    # `-wal` (эта уязвимость на импорте закрыта), остальной риск разбора чужой базы описан в , а
    # интерфейс предупреждает открывать только собственные копии.
    # Снять исключение, когда rusqlite_migration выйдет на rusqlite 0.42.
    { id = "RUSTSEC-2026-0459", reason = "SQLite до 3.54: нужен rusqlite 0.42, которого rusqlite_migration ещё не поддерживает" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# MPL-2.0 разрешена только этим крейтам: файловый копилефт,
# мы их не правим. Любой новый MPL-крейт снова упадёт здесь и потребует решения.
exceptions = [
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "selectors", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    { crate = "option-ext", allow = ["MPL-2.0"] },
]

[licenses.private]
# Крейты workspace (publish = false) не проверяются на лицензию.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Сеть допустима только для проверки обновлений: HTTP-стек входит в дерево лишь через плагин.
    { crate = "reqwest", wrappers = ["tauri-plugin-updater"] },
    { crate = "hyper", wrappers = ["reqwest", "hyper-rustls", "hyper-util"] },
    { crate = "ureq" },
    { crate = "isahc" },
    { crate = "surf" },
    { crate = "tauri-plugin-http" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
