[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/vault",
    "crates/storage",
    "crates/import",
    "crates/export",
    "crates/broker",
    "src-tauri",
]

[workspace.package]
version = "0.6.16"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
planning-budget-core = { path = "crates/core" }
planning-budget-vault = { path = "crates/vault" }
planning-budget-storage = { path = "crates/storage" }
planning-budget-import = { path = "crates/import" }
planning-budget-export = { path = "crates/export" }
planning-budget-broker = { path = "crates/broker" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
float_cmp = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
large_enum_variant = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
