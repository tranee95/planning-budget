[package]
name = "planning-budget-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = { version = "0.6.0", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
data-encoding = "2.11.1"
getrandom = "0.4.3"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
zeroize = "1.9.0"

[features]
# Только для тестов: пропускает облегчённые параметры Argon2id.
weak-kdf = []

[dev-dependencies]
planning-budget-vault = { path = ".", features = ["weak-kdf"] }
tempfile = "3.27.0"

