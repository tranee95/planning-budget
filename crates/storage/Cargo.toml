[package]
name = "planning-budget-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
planning-budget-core.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
data-encoding = "2.11.1"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl", "functions"] }
rusqlite_migration = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading"] }

