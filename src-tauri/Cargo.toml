[package]
name = "planning-budget-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "planning_budget_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
planning-budget-core.workspace = true
planning-budget-import.workspace = true
planning-budget-storage.workspace = true
planning-budget-vault.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
specta = "2.0.0-rc"
specta-typescript = "0.0.12"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2.4.1"
tauri-specta = { version = "2.0.0-rc", features = ["typescript", "derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
zeroize = "1.9.0"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
rusqlite = "0.40.2"
tempfile = "3.27.0"
